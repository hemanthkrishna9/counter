name: Build & Simulate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Diagnostics (SDK + Gradle)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          gradle --version
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "platforms dir missing"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "build-tools dir missing"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace 2>&1 | tail -100

      - name: Build Release AAB (Play Store)
        run: gradle bundleRelease --stacktrace 2>&1 | tail -100

      - name: Upload Debug APK (install on phone)
        uses: actions/upload-artifact@v4
        with:
          name: MantraCounter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release AAB (Play Store upload)
        uses: actions/upload-artifact@v4
        with:
          name: MantraCounter-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Appetize.io
        if: env.APPETIZE_TOKEN != ''
        run: |
          RESPONSE=$(curl -s \
            -u "$APPETIZE_TOKEN:" \
            -F "file=@app/build/outputs/apk/debug/app-debug.apk" \
            -F "platform=android" \
            https://api.appetize.io/v1/apps)

          echo "Appetize response: $RESPONSE"

          APP_KEY=$(echo "$RESPONSE" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('publicKey',''))")

          if [ -z "$APP_KEY" ] || [ "$APP_KEY" = "null" ]; then
            echo "Appetize upload failed."
            exit 1
          fi

          SIM_URL="https://appetize.io/app/$APP_KEY"
          echo "Simulator URL: $SIM_URL"

          {
            echo "## Mantra Counter - Live Simulator"
            echo ""
            echo "[Open in Appetize.io Browser Simulator]($SIM_URL)"
            echo ""
            echo "No install needed - runs Android directly in your browser."
          } >> "$GITHUB_STEP_SUMMARY"
