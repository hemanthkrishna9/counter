name: Build & Simulate

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 is required for Android Gradle Plugin 8.x
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Install Gradle 8.4 directly (no wrapper JAR needed in repo)
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # Android SDK is pre-installed on ubuntu-latest — just point to it
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: gradle assembleDebug

      # Always upload APK as a downloadable artifact (no secrets needed)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MantraCounter-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ---------------------------------------------------------------
      # OPTIONAL: Simulate in browser via Appetize.io
      # To enable: go to https://appetize.io → sign up (free) →
      # Dashboard → API token → add it as a GitHub secret named
      # APPETIZE_TOKEN in your repo Settings → Secrets → Actions
      # ---------------------------------------------------------------
      - name: Upload to Appetize.io & get simulator URL
        id: appetize
        if: ${{ secrets.APPETIZE_TOKEN != '' }}
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
        run: |
          RESPONSE=$(curl -s \
            -u "${APPETIZE_TOKEN}:" \
            -F "file=@app/build/outputs/apk/debug/app-debug.apk" \
            -F "platform=android" \
            https://api.appetize.io/v1/apps)

          APP_KEY=$(echo "$RESPONSE" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('publicKey',''))")

          if [ -n "$APP_KEY" ] && [ "$APP_KEY" != "null" ]; then
            SIM_URL="https://appetize.io/app/$APP_KEY"
            echo "app_key=$APP_KEY" >> "$GITHUB_OUTPUT"
            echo "sim_url=$SIM_URL"  >> "$GITHUB_OUTPUT"

            # Show in the Actions run summary page
            echo "## Mantra Counter — Live Simulator" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**[▶ Open in Appetize.io Browser Simulator]($SIM_URL)**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No install needed — runs Android directly in your browser." >> "$GITHUB_STEP_SUMMARY"

            echo "Simulator URL: $SIM_URL"
          else
            echo "Appetize upload failed. Response: $RESPONSE"
            exit 1
          fi
